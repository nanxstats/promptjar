[package]
name = "promptjar"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Query a Git repo of Markdown prompt archives like a database"
license = "MIT"
readme = "README.md"
repository = "https://github.com/nanxstats/promptjar"
keywords = ["prompt", "markdown", "frontmatter", "archive", "cli"]
categories = ["command-line-utilities", "text-processing"]
authors = ["Nan Xiao <me@nanx.me>"]
exclude = ["AGENTS.md", "SPEC.md", "okr.toml", "okr.lock", "deps-src/"]

[[bin]]
name = "ptj"
path = "src/main.rs"

# See SPEC.md section 8 for the justification of each dependency
[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
ignore = "0.4.33"
jiff = "0.2.35"
pulldown-cmark = { version = "0.13.4", default-features = false }
saphyr = "0.0.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
